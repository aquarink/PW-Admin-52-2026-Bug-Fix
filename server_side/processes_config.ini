[LOGSERVICE]
ProcessDir=$HOME$logservice
ProcessFileName=logservice
ProcessStart=setsid ./logservice logservice.conf
ProcessKill=pkill -9 logservice
ServerProcess=1
StartSleep=1

[UNIQUENAMED]
ProcessDir=$HOME$uniquenamed
ProcessFileName=uniquenamed
ProcessStart=setsid ./uniquenamed gamesys.conf
ProcessKill=pkill -9 uniquenamed
ServerProcess=1
StartSleep=2

[AUTHD]
ProcessDir=$HOME$authd/build
ProcessFileName=(authd|jio.jar)
ProcessStart=setsid ./authd start
ProcessKill=pkill -9 authd
ServerProcess=1
StartSleep=3

[GAMEDBD]
ProcessDir=$HOME$gamedbd
ProcessFileName=gamedbd
ProcessStart=setsid ./gamedbd gamesys.conf
ProcessKill=pkill -9 gamedbd
